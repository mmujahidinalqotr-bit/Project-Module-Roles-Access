<title>بوابة إدارة الصلاحيات | ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #1E3A5F; --navy2: #2D5A8E; --bg: #F8FAFC; --surface: #FFFFFF; --trans: all 0.3s ease; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
  body { background: var(--bg); color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
  .portal-container { background: var(--surface); border-radius: 16px; padding: 3rem; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; max-width: 600px; width: 90%; }
  .logo { max-width: 150px; margin-bottom: 1.5rem; }
  h1 { font-size: 1.8rem; color: var(--navy); margin-bottom: 0.5rem; }
  p { color: #666; margin-bottom: 2rem; font-size: 0.95rem; }
  .cards { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
  .card { background: var(--bg); border: 2px solid #E2E8F0; border-radius: 12px; padding: 2rem; width: 220px; text-decoration: none; color: inherit; transition: var(--trans); cursor: pointer; }
  .card:hover { border-color: var(--navy2); transform: translateY(-5px); box-shadow: 0 8px 20px rgba(45,90,142,0.1); }
  .card-icon { font-size: 3rem; margin-bottom: 1rem; }
  .card-title { font-weight: 700; font-size: 1.1rem; color: var(--navy); }
</style>
